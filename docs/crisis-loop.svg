  Drawn from ARCHITECTURE.md, section Data flow: injecting a crisis.
  0.02 and 1.00 are from docs/tcmf.md (300 scenarios, six baselines).
  Lambda is drawn as a symbol, not a number: it is a tuned default
  (4.0 on 2026-09-27, api/memory/tcmf.py) that research/tcmf_paper revisits.

  Hand-authored artwork. Animation degrades gracefully: static attribute
  values are the finished state.
  ============================================================================
-->
<defs>
<clipPath id="cv-clip"><rect x="0" y="0" width="900" height="450" rx="10"/></clipPath>
<marker id="cv-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2d3a4f"/></marker>
<path id="cv-run" d="M125 118 H 660 V 294 H 125 V 226 H 335 V 146" fill="none"/>
</defs>

<g clip-path="url(#cv-clip)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<rect x="0" y="0" width="900" height="450" fill="#0a0d13"/>

<text x="40" y="36" fill="#e8eef5" font-size="17" font-weight="700" letter-spacing="1.6">A SOCIETY THAT REMEMBERS WHY</text>
<text x="40" y="57" fill="#8b97a7" font-size="11.5">10 citizens, 5 institutional councils, one FastAPI process. Inject a crisis and watch the loop run.</text>

<!-- connectors -->
<g stroke="#2d3a4f" stroke-width="1.5" fill="none" marker-end="url(#cv-arr)">
<path d="M210 118 H 238"/>
<path d="M430 118 H 458"/>
<path d="M660 204 V 248"/>
<path d="M240 294 H 212"/>
<path d="M125 266 V 226 H 335 V 150" stroke-dasharray="4 3"/>
</g>

<!-- traveller -->
<circle r="4" fill="#6ea8fe"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#cv-run"/></animateMotion></circle>

<!-- 1 crisis -->
<rect x="40" y="90" width="170" height="56" rx="8" fill="#170e10" stroke="#f87171" stroke-width="1.8"/>
<text x="56" y="113" fill="#f87171" font-size="12.5" font-weight="700">1  crisis</text>
<text x="56" y="132" fill="#8b97a7" font-size="10">injected by a visitor</text>

<!-- 2 causal graph -->
<rect x="240" y="90" width="190" height="56" rx="8" fill="#0e131d" stroke="#1f2937" stroke-width="1.5"/>
<text x="256" y="113" fill="#e8eef5" font-size="12.5" font-weight="700">2  causal graph</text>
<text x="256" y="132" fill="#8b97a7" font-size="10">linked to what caused it</text>

<!-- 3 TCMF -->
<rect x="460" y="82" width="400" height="122" rx="9" fill="#0d1526" stroke="#6ea8fe" stroke-width="2"/>
<text x="476" y="106" fill="#6ea8fe" font-size="12.5" font-weight="700">3  TCMF retrieval, per council role</text>
<text x="476" y="130" fill="#e8eef5" font-size="10.5"><tspan x="476">episodic</tspan><tspan x="560">relevance x recency x importance</tspan></text>
<text x="476" y="148" fill="#e8eef5" font-size="10.5"><tspan x="476">causal</tspan><tspan x="560">walk back to the crisis's ancestors</tspan></text>
<rect x="476" y="162" width="368" height="26" rx="5" fill="#0a0d13" stroke="#1f2937"/>
<text x="490" y="179" fill="#6ea8fe" font-size="11" font-weight="700">normalize(episodic) + λ · causal_boost</text>

<!-- 4 council -->
<rect x="240" y="250" width="620" height="88" rx="9" fill="#120f1d" stroke="#a78bfa" stroke-width="1.8"/>
<text x="256" y="274" fill="#a78bfa" font-size="12.5" font-weight="700">4  council debate, streamed turn by turn</text>
<g font-size="10.5">
<rect x="256" y="286" width="100" height="24" rx="12" fill="#0a0d13" stroke="#3b3160"/><text x="306" y="302" fill="#e8eef5" text-anchor="middle">Historian</text>
<rect x="364" y="286" width="104" height="24" rx="12" fill="#0a0d13" stroke="#3b3160"/><text x="416" y="302" fill="#e8eef5" text-anchor="middle">Strategist</text>
<rect x="476" y="286" width="86" height="24" rx="12" fill="#0a0d13" stroke="#3b3160"/><text x="519" y="302" fill="#e8eef5" text-anchor="middle">Skeptic</text>
<rect x="570" y="286" width="98" height="24" rx="12" fill="#0a0d13" stroke="#3b3160"/><text x="619" y="302" fill="#e8eef5" text-anchor="middle">Predictor</text>
<rect x="676" y="286" width="112" height="24" rx="12" fill="#0a0d13" stroke="#a78bfa"/><text x="732" y="302" fill="#a78bfa" text-anchor="middle">Synthesizer</text>
</g>
<text x="256" y="328" fill="#8b97a7" font-size="10">models: Ollama -&gt; Gemini -&gt; Claude / OpenRouter</text>

<!-- 5 verdict -->
<rect x="40" y="266" width="170" height="56" rx="8" fill="#0e131d" stroke="#1f2937" stroke-width="1.5"/>
<text x="56" y="289" fill="#e8eef5" font-size="12.5" font-weight="700">5  verdict</text>
<text x="56" y="308" fill="#8b97a7" font-size="10">fear, factions shift</text>
<text x="146" y="218" fill="#8b97a7" font-size="9.5">verdict written back into the graph</text>


<!-- finding -->
<rect x="40" y="356" width="820" height="50" rx="8" fill="#0e131d" stroke="#1f2937"/>
<text x="56" y="377" fill="#fbbf24" font-size="10.5" font-weight="700">why the plus sign</text>
<text x="56" y="395" fill="#e8eef5" font-size="10.5">v1 multiplied the two scores: recall@5 0.02 where the causal signal alone reaches 1.00. Normalized additive recovers 1.00.</text>

<rect x="0" y="426" width="900" height="24" fill="#070a0f"/>
<text x="40" y="442" fill="#4a5563" font-size="10" letter-spacing="2.2">CIVILIZATIONOS  ·  ORIGINAL WORK OF ZAID ALI SYED  ·  ORCID 0009-0003-4313-1510  ·  MMXXVI</text>
</g>
</svg>
