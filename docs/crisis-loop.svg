<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="CivilizationOS in one picture. A crisis is injected and becomes a node in a causal graph linked to the prior events that caused it. TCMF retrieval fuses each citizen's episodic memory score with a causal boost from walking the graph back to the crisis's ancestors, as normalized episodic score plus lambda times causal boost. Five council roles, Historian, Strategist, Skeptic, Predictor and Synthesizer, debate with that context through a three-tier model router. The verdict changes fear and factions and is written back into the causal graph for the next crisis. The first, multiplicative version of TCMF scored recall at 5 of 0.02 where the causal signal alone reaches 1.00; the normalized additive form recovers 1.00.">
